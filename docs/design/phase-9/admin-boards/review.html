<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>관리자 화면과 시안 확인</title><style>body{margin:0;background:#eaf4fa;color:#17334a;font:16px/1.7 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:28px 20px}h1{font-size:26px;margin:0 0 8px}h2{font-size:20px}p{margin:8px 0 20px}section{border-top:1px solid #b8cfde;padding:20px 0}a{color:#245ac1}img{display:block;max-width:100%;height:auto;border:1px solid #b8cfde;background:white;border-radius:8px}small{display:block;color:#496376}a:focus-visible{outline:3px solid #245ac1;outline-offset:4px}</style><main><h1>관리자 실제 화면과 생성 시안</h1><p>이미지를 누르면 원본을 크게 볼 수 있습니다. 실제 화면에는 연습 자료만 사용했습니다.</p><section><h2>정리된 퀴즈 목록</h2><p>설교일과 제목, 오른쪽 참여 인원·작업 아이콘을 한 행으로 모았습니다.</p><a href="/images/admin-guide/dashboard.png"><img src="/images/admin-guide/dashboard.png" alt="설교일 기준의 짧은 퀴즈 게시판"></a></section><section><h2>실제 참여 기록 화면</h2><p>현재 React 화면을 촬영한 예시입니다.</p><a href="/images/admin-guide/submissions.png"><img src="/images/admin-guide/submissions.png" alt="실제 참여 기록 예시: 종류와 상태, 펼친 관리 도구"></a></section><section><h2>참여 기록 생성 시안</h2><p>배치 참고용 이미지입니다. 실제 적용 화면과 구별합니다.</p><a href="submissions-reference.png"><img src="submissions-reference.png" alt="참여 기록의 생성 시안"></a></section><section><h2>문의 게시판 생성 시안</h2><a href="inquiries-reference.png"><img src="inquiries-reference.png" alt="문의 게시판의 생성 시안"></a></section><small>기존 이미지를 그대로 재사용했습니다.</small></main></html>
